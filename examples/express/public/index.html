<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hashcash-captcha Express example</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
      color: #1f2933;
      background: #f8fafc;
    }

    body {
      margin: 0;
      padding: 2rem;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem;
      border: 1px solid #e4e7eb;
      border-radius: 0.75rem;
      background: #ffffff;
      box-shadow: 0 10px 25px rgba(31, 41, 51, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    .captcha {
      margin: 1.5rem 0;
      min-height: 3rem;
    }

    #server-result {
      margin: 1rem 0 0;
      padding: 0.75rem 1rem;
      border-radius: 0.375rem;
      background: #f5f7fa;
      color: #52606d;
    }

    #server-result[data-result="success"] {
      background: #c6f6d5;
      color: #22543d;
    }

    #server-result[data-result="rejected"] {
      background: #fed7d7;
      color: #822727;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <main>
    <h1>hashcash-captcha Express example</h1>
    <p>
      This page mounts the <code>mountCaptcha</code> widget, obtains a challenge
      from <code>GET /api/captcha/challenge</code>, runs the automatic
      WebGPU/JavaScript solver, and submits the resulting
      <code>{ token, nonce }</code> to <code>POST /api/captcha/verify</code>.
    </p>

    <div id="captcha" class="captcha"></div>

    <p id="server-result" data-result="waiting" role="status" aria-live="polite">
      Waiting for verification…
    </p>
  </main>

  <script type="module">
    import { mountCaptcha } from '/vendor/widget.js';

    const result = document.getElementById('server-result');

    function report(state, text) {
      result.dataset.result = state;
      result.textContent = text;
    }

    const widget = mountCaptcha(document.getElementById('captcha'), {
      async getChallenge({ signal }) {
        const response = await fetch('/api/captcha/challenge', {
          headers: { accept: 'application/json' },
          signal
        });

        if (!response.ok) {
          throw new Error(`challenge request failed with status ${response.status}`);
        }

        return await response.json();
      },

      async onSolved({ token, nonce }) {
        report('waiting', 'Submitting server verification…');

        try {
          const response = await fetch('/api/captcha/verify', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              accept: 'application/json'
            },
            body: JSON.stringify({ token, nonce })
          });

          const payload = await response.json();

          if (response.ok && payload.ok === true) {
            report('success', 'Server confirmed success.');
          } else {
            const detail =
              payload && typeof payload.error === 'string'
                ? `: ${payload.error}`
                : '.';
            report('rejected', `Server rejected verification${detail}`);
          }
        } catch (error) {
          report('rejected', `Verification request failed: ${error.message}`);
        }
      },

      onError(error) {
        report('rejected', `Verification failed: ${error.message}`);
      }
    });
  </script>
</body>
</html>
